name: Build com IA Debug

on:
  push:
    branches:
      - main
      - dev
      - feature/*
      - hotfix/*
      - bugfix/*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Executa build e IA

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Instala dependências
        run: pip install requests

      - name: Executa build com possível erro
        id: build_step
        run: |
          set +e
          python3 pipeline_code/build.py 2>&1 | tee build.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          exit 0
        continue-on-error: true

      - name: Executa IA explicadora se falhar
        if: steps.build_step.outputs.exit_code != '0'
        run: |
          echo "Executando IA para explicar erro..."
          python3 ia/analise.py < build.log
